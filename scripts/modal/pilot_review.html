<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qwen3.8 development video review</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101621;color:#eef1f6}
body{max-width:1100px;margin:0 auto;padding:clamp(16px,4vw,40px)}h1{font-size:1.65rem;margin:0 0 1rem}
label,output{font-weight:650}select,button{font:inherit;margin:.3rem;padding:.4rem .65rem;border:1px solid #64758c;border-radius:5px;background:#213049;color:inherit}
video{display:block;width:100%;height:auto;max-height:52vh;background:#080d16}
#cameras,#frame{color:#bac7d9}#cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));margin-top:1rem}
#cards[hidden]{display:none}
article{border:1px solid #3b4c62;border-radius:8px;padding:1rem;background:#1a2435}article h2{font-size:1rem;margin:0}
article output{display:block;margin:.65rem 0}.yes{color:#ffb2af}.no{color:#a8e8be}pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}summary{cursor:pointer}
</style>
</head>
<body>
<h1>Qwen3.8 development video review</h1>
<label for="clip">Clip</label> <select id="clip"></select>
<p id="task"></p><p id="cameras"></p>
<video id="video" controls preload="metadata" playsinline></video>
<div>
<button id="previous" type="button">Previous frame</button><button id="next" type="button">Next frame</button>
<output id="frame" aria-live="off"></output>
</div>
<div>
<button id="reveal" type="button">Show annotations</button>
<button id="identities" type="button" hidden>Reveal model identities</button>
</div>
<section id="cards" aria-label="Frame-aligned annotations" hidden></section>
<script>
const data = __PILOT_DATA__;
const byId = id => document.getElementById(id);
const select = byId("clip"), video = byId("video"), cards = byId("cards");
let clip, clipURL, showIdentities = false;
const node = (tag, text) => Object.assign(document.createElement(tag), {textContent:text});
const indexAt = () => Math.min(clip.count - 1, Math.floor(video.currentTime * clip.fps + 0.001));
function renderCards(){
  cards.replaceChildren();
  for(const [index, answer] of clip.answers.entries()){
    const card = node("article", "");
    card.append(node("h2", showIdentities ? answer.identity : "Annotation " + "ABC"[index]));
    const output = node("output", "");
    const details = node("details", "");
    details.append(node("summary", "Read Markdown"), node("pre", answer.markdown || "Output unavailable"));
    card.append(output, details);
    cards.append(card);
  }
  updateTime();
}
function updateTime(){
  const absolute = clip.start + indexAt();
  byId("frame").textContent = "Source frame " + absolute + " · " + (absolute / clip.fps).toFixed(2) + " s";
  if(cards.hidden) return;
  for(const [index, output] of [...cards.querySelectorAll("output")].entries()){
    const intervals = clip.answers[index].intervals;
    const match = intervals?.find(([a,b]) => a <= absolute && absolute < b);
    output.textContent = !intervals ? "Timeline unavailable" : match ? "Failure · " + match.join("–") : "No failure";
    output.className = match ? "yes" : intervals ? "no" : "";
  }
}
function changeClip(){
  clip = data[Number(select.value)]; showIdentities = false;
  byId("task").textContent = clip.task;
  byId("cameras").textContent = "Cameras from left to right · " + clip.cameras.join(" · ");
  cards.hidden = true; byId("reveal").hidden = false; byId("identities").hidden = true;
  cards.replaceChildren();
  if(clipURL) URL.revokeObjectURL(clipURL);
  const bytes = Uint8Array.from(atob(clip.video), char => char.charCodeAt(0));
  clipURL = URL.createObjectURL(new Blob([bytes], {type:"video/mp4"}));
  video.src = clipURL;
  updateTime();
}
function step(offset){
  video.pause();
  const next = Math.min(clip.count - 1, Math.max(0, indexAt() + offset));
  video.currentTime = (next + 0.01) / clip.fps;
  updateTime();
}
for(const [index, row] of data.entries())
  select.append(Object.assign(node("option", row.id + " · " + row.task), {value:String(index)}));
select.addEventListener("change", changeClip);
video.addEventListener("timeupdate", updateTime);
video.addEventListener("loadedmetadata", updateTime);
byId("previous").addEventListener("click", () => step(-1));
byId("next").addEventListener("click", () => step(1));
byId("reveal").addEventListener("click", () => {
  byId("reveal").hidden = true; cards.hidden = false; byId("identities").hidden = false; renderCards();
});
byId("identities").addEventListener("click", () => {
  showIdentities = true; byId("identities").hidden = true; renderCards();
});
changeClip();
</script>
</body>
</html>
